[workspace]
authors = ["Ajith Pattammattel"]
channels = ["conda-forge"]
name = "xrf-roi-scan-planner"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = ">=3.10,<3.14"
pyqt6 = "*"
pyqtgraph = ">=0.13.4"
numpy = ">=1.24"
hxntools = ">=0.6.5,<0.7"
ipython = ">=9.17.1,<10"
bluesky-queueserver-api = ">=0.0.13,<0.0.14"
bluesky-queueserver = ">=0.0.25,<0.0.26"

[tasks]
roi_finder = "python src/roi_finder/main.py"
roi-planner = "python src/roi_finder/main.py"
gui = "python -m roi_finder.main"
